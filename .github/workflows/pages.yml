# Deploy the static browser app to GitHub Pages.
# The site is the repo root minus tooling, tests and docs; there is no build step.
name: Pages
on:
  push:
    branches: [main]
    # Catalog-only changes do not change the app, so they skip the redeploy.
    paths-ignore: ['data/hyg-nearby.csv']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Stage site
        run: |
          # Tracked files only, so local artifacts can never be published.
          mkdir -p "$RUNNER_TEMP/site"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/site"
          rm -rf "$RUNNER_TEMP/site/.github" "$RUNNER_TEMP/site/test" "$RUNNER_TEMP/site/docs"
          find "$RUNNER_TEMP/site" -maxdepth 1 -type f \( -name '*.md' -o -name '.gitignore' \) -delete
          if [ ! -f "$RUNNER_TEMP/site/index.html" ]; then
            echo '::warning::No index.html at the repo root; the site root will return 404.'
          fi
          find "$RUNNER_TEMP/site" -type f | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
